name: gate

# The honest gate, running in the cloud on every push.
#
# Why this exists: in round 2 a fresh critic found that 768 tests, a determinism
# replay and a perf gate all reported CHECK GREEN on a build where the main menu
# was never in the scene tree and 68 engine errors printed per run. A gate that
# only ever agrees with the person who wrote the code is worthless. This one runs
# on a machine nobody is logged into, and it publishes what it saw.
#
# Free and unmetered: standard GitHub-hosted runners, including macOS, are free
# for PUBLIC repositories with no minute cap. If this repo is ever made private
# again, macOS minutes bill at a 10x multiplier and this file should be cut back
# to the Linux jobs only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  gate-macos:
    name: gate (macOS, headless)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-macos-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          rm godot.zip

      - name: Godot version
        run: |
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV
          "$HOME/godot/Godot.app/Contents/MacOS/Godot" --headless --version

      - name: Import assets
        run: |
          "$GODOT" --headless --path . --import 2>&1 | tail -20

      # Engine-level errors go to stderr and never touch our own Log, which is
      # exactly how a broken build stayed green for a whole phase. Capture both
      # streams and count them ourselves.
      - name: Run the gate
        id: gate
        run: |
          set +e
          bash tools/check.sh 2>&1 | tee gate.log
          echo "gate_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: Count engine-level errors
        id: engine
        run: |
          n=$(grep -cE "^ERROR:|SCRIPT ERROR:|Parse Error|add_child\(\) failed" gate.log || true)
          echo "count=$n" >> $GITHUB_OUTPUT
          echo "engine-level errors: $n"
          if [ "$n" -gt 0 ]; then
            echo "::warning::$n engine-level error line(s) in the gate output"
            grep -E "^ERROR:|SCRIPT ERROR:|Parse Error|add_child\(\) failed" gate.log | sort | uniq -c | sort -rn | head -20
          fi

      - name: Deterministic simulation run
        run: |
          "$GODOT" --headless --path . -- --harness --scenario=first_night \
            --ticks=12000 --out=artifacts/ci_sim 2>&1 | tail -25

      - name: Summary
        if: always()
        run: |
          {
            echo "## Gate result"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| check.sh exit code | ${{ steps.gate.outputs.gate_exit }} |"
            echo "| engine-level error lines | ${{ steps.engine.outputs.count }} |"
            echo "| GDScript files | $(find game tests -name '*.gd' | wc -l | tr -d ' ') |"
            echo "| GDScript lines | $(find game tests -name '*.gd' -exec cat {} + | wc -l | tr -d ' ') |"
            echo ""
            echo '```'
            tail -40 gate.log 2>/dev/null || echo "(no gate.log)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-macos-artifacts
          path: |
            gate.log
            artifacts/
          retention-days: 14
          if-no-files-found: warn

      # check.sh prints its verdict in the middle of a 1000-line job log, so
      # reading "what is red now" costs a log download and a scroll. Reprint it
      # here, at the very end, where `tail` finds it.
      - name: What is red
        if: always()
        run: |
          echo "──────────────── failing / unchecked stages ────────────────"
          grep -E '^ (FAIL|SKIP)  ' gate.log || echo "(none)"
          echo "──────────────── which tests ────────────────"
          # The stage line only gives a count. Naming them here is the difference
          # between one log read per iteration and three.
          sed -n '/^ *FAILURES (/,/^ *────/p' gate.log \
            | grep -E '^ *[0-9]+\) |^ *(assert_|expected:|actual:)' | head -40 || true
          echo "──────────────── which engine errors ────────────────"
          grep -E '^   x[0-9]+ +(SCRIPT_ERROR|ENGINE_ERROR|USER_ERROR)' gate.log | head -12 || true
          echo "──────────────── which contract bands ────────────────"
          grep -E '^   FAIL  ' gate.log | head -20 || true
          echo "──────────────── verdict ────────────────"
          grep -E '^CHECK (RED|GREEN)' gate.log || echo "(check.sh printed no verdict — it did not finish)"

      - name: Fail if the gate failed
        if: steps.gate.outputs.gate_exit != '0'
        run: |
          echo "check.sh exited ${{ steps.gate.outputs.gate_exit }}"
          exit 1

  screenshots:
    name: screenshots (Linux, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install xvfb and GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa fontconfig

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot

      - name: Import assets
        run: |
          xvfb-run -a ~/godot/godot --headless --path . --import 2>&1 | tail -20

      # Real frames from the real renderer. This is what a critic is handed
      # instead of a builder's summary.
      - name: Render the scenario
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ~/godot/godot --path . --resolution 1920x1080 \
            -- --harness --visual --scenario=first_night --out=artifacts/ci_vis 2>&1 | tail -30
          ls -la artifacts/ci_vis/shots/ || echo "NO SHOTS PRODUCED"

      # Can a human actually open every screen? This is the suite that would have
      # caught the phase where the whole build menu was an orphan node. It needs a
      # display, which is why it lives here and not in the headless macOS job.
      # Three ways this can be wrong, and the old version only checked one of
      # them. `grep TESTS FAILED` says nothing about a suite that died before it
      # printed a verdict (exit 0, no output, green), and nothing about one that
      # ran but could not ask half its questions. Take the process's own exit
      # code as the primary signal and require a verdict on top of it.
      - name: Reachability suite
        id: reach
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ~/godot/godot --path . tests/boot/run_reachability.tscn -- --force-ui > reach.log 2>&1
          code=$?
          set -e
          cat reach.log
          failed=0
          if [ "$code" -ne 0 ]; then
            echo "::error::reachability suite exited $code"
            failed=1
          fi
          if grep -q "TESTS FAILED" reach.log; then
            echo "::error::reachability suite reported TESTS FAILED"
            grep -E "^\s*FAIL" reach.log | head -20
            failed=1
          elif grep -q "TESTS PASSED, PARTIAL" reach.log; then
            echo "::error::reachability suite could not ask every question it exists to ask"
            grep -E "^\s*UNCHECKED" reach.log | head -20
            failed=1
          elif ! grep -q "TESTS PASSED" reach.log; then
            echo "::error::reachability suite printed no verdict — did it run at all?"
            failed=1
          fi
          echo "reach_failed=$failed" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          n=$(ls artifacts/ci_vis/shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## Screenshots"
            echo "frames written: **$n**"
            if [ "$n" = "0" ]; then
              echo ""
              echo "No frames were produced. The visual harness did not render."
            fi
            echo ""
            echo "> Rendered under xvfb with software GL (llvmpipe). Colour and lighting"
            echo "> can differ from a real GPU, so judge composition and legibility here,"
            echo "> and judge final art direction on a machine with a GPU."
            echo ""
            echo "## Reachability"
            grep -E "^\s*FAIL|checks, .* failures|TESTS (PASSED|FAILED)" reach.log 2>/dev/null | head -20 || echo "(suite did not run)"
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if reachability failed
        if: steps.reach.outputs.reach_failed == '1'
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/ci_vis/
          retention-days: 14
          if-no-files-found: warn

  # STANDING INSTRUCTION FROM MAXIMILIAN (2026-08-14): test on the macOS runner.
  #
  # This was an open question and is now answered by measurement, not assumption:
  # a GitHub macOS runner has no logged-in GUI session, and Godot renders on it
  # anyway. Probe run 31815322032 wrote six frames of ~1 MB each through Metal.
  #
  # ONE CAVEAT, measured: the window is clamped to about 1024x631 regardless of
  # --resolution, because there is no real display to open 1920x1080 on. Judge
  # composition and legibility here; judge fine art direction at full size on a
  # machine with a screen.
  #
  # The Linux/xvfb job stays as a cross-check: it runs software GL on different
  # hardware, so a defect that appears in both is in the game, not the runner.
  visual-macos:
    name: visual + reachability (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-macos-${{ env.GODOT_VERSION }}
      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip && rm godot.zip
      - name: Import
        run: ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --import 2>&1 | tail -5
      - name: Render first_night
        run: |
          set +e
          ~/godot/Godot.app/Contents/MacOS/Godot --path . --resolution 1920x1080 \
            -- --harness --visual --scenario=first_night --out=artifacts/mac_vis 2>&1 | tail -30
          echo "harness exit: $?"
          set -e
          n=$(ls artifacts/mac_vis/shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "frames: $n"
          echo "macOS frames rendered: **$n**" >> $GITHUB_STEP_SUMMARY
          if [ "$n" = "0" ]; then echo "::error::macOS produced no frames"; exit 1; fi

      # The suite that would have caught the phase where the whole build menu was
      # an orphan. It needs a display; macOS provides one well enough to run it.
      - name: Reachability suite
        run: |
          set +e
          ~/godot/Godot.app/Contents/MacOS/Godot --path . tests/boot/run_reachability.tscn \
            -- --force-ui 2>&1 | tee reach_mac.log
          code=$?
          set -e
          echo "reachability exit: $code"
          grep -E "TESTS (PASSED|FAILED)|checks, .* failures|^\s*FAIL" reach_mac.log | head -20 >> $GITHUB_STEP_SUMMARY || true
          if [ "$code" != "0" ]; then echo "::error::reachability suite exit $code"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-visual-probe
          path: artifacts/mac_vis/
          if-no-files-found: warn
