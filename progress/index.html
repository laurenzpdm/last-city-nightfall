<!doctype html>
<meta charset="utf-8">
<title>Last City: Nightfall — Live Build</title>
<style>
:root{--bg:#070a10;--pan:#0d121c;--pan2:#111826;--ln:#1d2738;--tx:#dfe6f2;--dim:#7b8aa3;
--warm:#ff8a3d;--warm2:#ffc46b;--cold:#5fa8ff;--ok:#4bd48b;--bad:#ff5f6d;--wip:#ffc46b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#131c2b 0%,var(--bg) 60%);
color:var(--tx);font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;padding:28px 32px 80px}
h1{font-size:26px;margin:0 0 2px;letter-spacing:.5px;font-weight:600}
h1 span{color:var(--warm)}
.sub{color:var(--dim);font-size:12px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:13px 15px}
.card.wide{grid-column:1/-1}
.kpi{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.kpi div{background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:11px 18px;min-width:120px}
.kpi b{display:block;font-size:23px;color:var(--warm2);font-weight:600}
.kpi small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.part{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #131a27}
.part:last-child{border:0}
.part .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 9px currentColor}
.s-done .dot,.s-done{color:var(--ok)} .s-wip .dot{color:var(--wip)}
.s-fail .dot{color:var(--bad)} .s-todo .dot{color:#38455c;box-shadow:none}
.dot{background:currentColor}
.sc{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{height:5px;background:#141c2b;border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--warm),var(--warm2))}
h2{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);margin:0 0 9px;font-weight:600}
.log{max-height:340px;overflow:auto;font-size:12px}
.log div{padding:3px 0;border-bottom:1px solid #121926;display:flex;gap:9px}
.log time{color:#4d5c75;flex:none;font-size:11px}
.verdict{font-size:13px;line-height:1.65}
.verdict .gap{color:var(--warm2)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;
border:1px solid var(--ln);color:var(--dim);margin-right:5px}
.tag.win{border-color:#22623f;color:var(--ok)} .tag.lose{border-color:#6b2530;color:var(--bad)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.shots img{width:100%;border-radius:6px;border:1px solid var(--ln);display:block;background:#000}
.shots figcaption{font-size:10px;color:var(--dim);margin-top:3px;text-align:center}
.pulse{animation:p 1.9s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.err{color:var(--bad)}
</style>
<h1>Last City: <span>Nightfall</span></h1>
<div class="sub" id="sub">loading…</div>
<div class="kpi" id="kpi"></div>
<div class="grid">
  <div class="card wide"><h2>Critic verdict — blind vs Factorio &amp; Frostpunk</h2><div class="verdict" id="verdict">waiting for first gauntlet…</div></div>
  <div class="card"><h2>Parts</h2><div id="parts"></div></div>
  <div class="card"><h2>Activity</h2><div class="log" id="log"></div></div>
  <div class="card wide"><h2>Latest build — actual frames</h2><div class="shots" id="shots"></div></div>
</div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function j(p){try{const r=await fetch(p+'?t='+Date.now());if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function lines(p){try{const r=await fetch(p+'?t='+Date.now());if(!r.ok)return[];
 return (await r.text()).trim().split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean)}catch(e){return[]}}
function tick(){
 const el=$('sub');const d=new Date();
 el.textContent=el.dataset.base?el.dataset.base+'  ·  '+d.toLocaleTimeString():el.textContent;
}
async function refresh(){
 const s=await j('status.json');
 if(!s){$('sub').textContent='no status.json yet — build starting…';return}
 $('sub').dataset.base=`${s.phase||'—'}  ·  round ${s.round??0}  ·  ${s.state||''}`;tick();
 const done=(s.parts||[]).filter(p=>p.status==='done').length,tot=(s.parts||[]).length||1;
 $('kpi').innerHTML=[
  ['Round',s.round??0],['Phase',s.phase||'—'],
  ['Parts green',`${done}/${tot}`],
  ['Critic score',(s.critic_score??'—')+(s.critic_score?'/10':'')],
  ['Blind wins',`${s.blind_wins??0}/${s.blind_total??0}`],
  ['Agents live',s.agents_live??0],
 ].map(([k,v])=>`<div><small>${k}</small><b>${esc(v)}</b></div>`).join('');
 $('parts').innerHTML=(s.parts||[]).map(p=>{
   const c={done:'s-done',in_progress:'s-wip',failed:'s-fail'}[p.status]||'s-todo';
   return `<div class="part ${c}"><i class="dot ${p.status==='in_progress'?'pulse':''}"></i>
   <span class="nm">${esc(p.id)} ${esc(p.name)}</span><span class="sc">${p.score!=null?p.score+'/10':''}</span></div>`}).join('')||'<div class="sc">—</div>';
 if(s.verdict){
  $('verdict').innerHTML=
   (s.verdict.blind||[]).map(b=>`<span class="tag ${b.winner==='ours'?'win':'lose'}">${esc(b.dimension)}: ${esc(b.winner)}</span>`).join('')+
   `<p>${esc(s.verdict.summary||'')}</p>`+
   (s.verdict.biggest_gap?`<p><b class="gap">Single biggest gap →</b> ${esc(s.verdict.biggest_gap)}</p>`:'');
 }
 const ev=await lines('events.jsonl');
 $('log').innerHTML=ev.slice(-70).reverse().map(e=>
  `<div><time>${esc((e.t||'').slice(11,19))}</time><span class="${e.level==='error'?'err':''}">${esc(e.msg)}</span></div>`).join('')||'<div class="sc">—</div>';
 if(s.shots&&s.shots.length){
  $('shots').innerHTML=s.shots.map(p=>
   `<figure style="margin:0"><img src="${esc(p)}?t=${Date.now()}" onerror="this.style.opacity=.15"><figcaption>${esc(p.split('/').pop())}</figcaption></figure>`).join('');
 }
}
refresh();setInterval(refresh,4000);setInterval(tick,1000);
</script>
