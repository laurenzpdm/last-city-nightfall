; Last City: Nightfall — export presets. [P24] OWNED, kept here on purpose.
;
; Godot reads presets from `export_presets.cfg` at the PROJECT ROOT, and the
; root is shared by twenty parts working in parallel. This file is the version
; controlled master; `game/ui/meta/export_build.gd` copies it to the root before
; exporting and `tools/` never has to know about it. Running
;
;   godot --headless --path . --script game/ui/meta/export_build.gd -- --all
;
; writes the root copy and produces both binaries in dist/.
;
; Templates: `linux_release.x86_64` and `windows_release_x86_64.exe` from the
; official 4.7.1 export templates. With no templates installed the export fails
; loudly rather than writing a 0-byte file — that is the engine's behaviour and
; the reason the build script checks the size of what it produced.
;
; NO STEAMWORKS BINARY. See game/ui/meta/steam_seam.gd for the seam and for what
; turning it on costs. `custom_template` is left empty so both presets use the
; stock templates; a Steam build does not need a custom template at all.

[preset.0]

name="Linux/X11 64"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; artifacts/ is run output and tests/ is the harness: neither belongs in a
; player's download, and artifacts/ alone is 40 MB of PNGs.
exclude_filter="artifacts/*, tests/*, docs/*, progress/*, tools/*, *.md"
export_path="dist/linux/last-city-nightfall.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows Desktop 64"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="artifacts/*, tests/*, docs/*, progress/*, tools/*, *.md"
export_path="dist/windows/last-city-nightfall.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
; The icon and the version block need `rcedit`, which is a separate download and
; is NOT bundled here. Without it Godot warns once and produces a working .exe
; wearing the engine's own icon. Point application/modify_resources at a real
; rcedit in the editor settings when the store page needs the branded icon.
application/modify_resources=false
application/icon="res://icon.svg"
application/console_wrapper_icon=""
application/file_version="0.1.0"
application/product_version="0.1.0"
application/company_name="Last City"
application/product_name="Last City: Nightfall"
application/file_description="A dying city on a frozen plain."
application/copyright="MIT"
application/trademarks=""
application/export_angle=0
ssh_remote_deploy/enabled=false
